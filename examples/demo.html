<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>walkthrough-lib demo</title>
<link rel="stylesheet" href="../src/style.css" />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    color: #111827;
    background: #f9fafb;
  }
  .app {
    display: flex;
    min-height: 100vh;
  }
  .sidebar {
    width: 220px;
    background: #111827;
    color: #fff;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .sidebar h2 {
    font-size: 16px;
    margin: 0 0 12px;
  }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    background: #1f2937;
    color: #fff;
    border: 1px solid #374151;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  .nav-btn:hover {
    background: #374151;
  }
  .content {
    flex: 1;
    padding: 40px;
    max-width: 640px;
  }
  form {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 320px;
  }
  label {
    font-size: 13px;
    font-weight: 600;
  }
  input {
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
  }
  form button {
    align-self: flex-start;
    padding: 8px 16px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #start-tour {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 18px;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    z-index: 100;
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>MyApp</h2>
      <button class="nav-btn" data-testid="create-project-btn" aria-label="Create new project">+ New Project</button>
      <button class="nav-btn" aria-label="Open settings">&#9881; Settings</button>
    </aside>
    <main class="content">
      <h1>Dashboard</h1>
      <p>Welcome to your dashboard. Use the sidebar to create a project, or update your profile below.</p>
      <form id="signup-form">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" />
        <button type="submit">Submit</button>
      </form>
    </main>
  </div>

  <button id="start-tour">Start Tour</button>

  <script type="module">
    import { TourPlayer } from "../dist/esm/index.js";

    const flow = {
      id: "onboarding-demo",
      title: "Demo onboarding flow",
      version: 1,
      steps: [
        {
          id: "step-1",
          selectors: {
            testId: "create-project-btn",
            ariaLabel: "Create new project",
            text: "+ New Project"
          },
          title: "Create a project",
          text: "Click here to create your first project.",
          placement: "right"
        },
        {
          id: "step-2",
          selectors: {
            ariaLabel: "Open settings"
          },
          title: "Open settings",
          text: "Click the settings icon to configure your app.",
          placement: "right"
        },
        {
          id: "step-3",
          selectors: {
            text: "Submit"
          },
          title: "Submit the form",
          text: "Click submit to save your changes.",
          placement: "top"
        },
        {
          id: "step-4",
          selectors: {
            cssPath: "#signup-form input[type=\"email\"]"
          },
          title: "Enter your email",
          text: "Click the email field to enter your address.",
          placement: "bottom"
        }
      ]
    };

    const player = new TourPlayer();

    document.getElementById("start-tour").addEventListener("click", () => {
      player.start(flow, {
        onStepUnresolved: (step) => {
          console.warn("walkthrough-lib: could not resolve step", step.id);
        }
      });
    });

    // Prevent the demo form from actually navigating away when Submit is clicked.
    document.getElementById("signup-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
    });
  </script>
</body>
</html>
